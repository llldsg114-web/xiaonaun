<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 心屿 APP 图标 · 对话气泡 + 心 重设计（全量重写）。
       方向：对话气泡包裹一颗渐变心，象征 AI 陪伴对话。温暖、色彩丰富、贴合「心屿」品牌。
       无黑、无暗、无人物、无文字，完全符号化品牌标记。
       构图：
         ① 背景：粉桃(#ffd9c2) → 柔粉(#ffc6e0) → 天蓝(#bfe9ff) 轻盈三色渐变，rx=0 铺满不透明。
         ② 对话气泡：柔和 白(#ffffff) → 粉(#ffe3f0) 渐变，圆角 + 底尾（tail），浅粉描边，上左玻璃高光。
         ③ 渐变心：粉(#ffd9ec) → 珊瑚粉(#ff8fb1) → 紫(#a98bff) 温暖渐变，珊瑚粉描边，上左高光。
         ④ 星光点缀：暖黄 4 角 sparkle（#fff6c8 → #ffe08a），角落几枚不喧宾夺主。
       配色温暖多彩但避免近黑；cairosvg 2.8.2 约束：仅 linearGradient，
       禁 filter / radialGradient / mask / clip-path / foreignObject。
       根 <svg> 不写 width/height，交给 CLI -W/-H。背景 rect 铺满 512×512 且 rx=0 → 不透明（防圆角黑边）。 -->
  <defs>
    <!-- 背景：粉桃 → 柔粉 → 天蓝（对角渐变） -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c2"/>
      <stop offset="0.5" stop-color="#ffc6e0"/>
      <stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <!-- 对话气泡：白 → 柔粉 -->
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3f0"/>
    </linearGradient>
    <!-- 渐变心：粉 → 珊瑚粉 → 紫 -->
    <linearGradient id="heart" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd9ec"/>
      <stop offset="0.5" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <!-- 星光 sparkle：暖黄 -->
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
  </defs>

  <!-- ① 背景：铺满且不透明（粉桃→柔粉→天蓝） -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- ② 星光点缀（先画在气泡后，落在背景角落，低调温暖） -->
  <path fill="url(#spark)"
        d="M 112,68 Q 120,88 140,96 Q 120,104 112,124 Q 104,104 84,96 Q 104,88 112,68 Z"/>
  <path fill="url(#spark)"
        d="M 446,98 Q 452,114 468,120 Q 452,126 446,142 Q 440,126 424,120 Q 440,114 446,98 Z"/>
  <path fill="url(#spark)"
        d="M 84,410 Q 90,424 104,430 Q 90,436 84,450 Q 78,436 64,430 Q 78,424 84,410 Z"/>

  <!-- ③ 对话气泡：圆角矩形 + 底尾（单一闭合路径，描边连续不露缝） -->
  <path fill="url(#bubble)" stroke="#ffd0e2" stroke-width="6" stroke-linejoin="round"
        d="M 140,104
           H 372
           Q 432,104 432,164
           V 268
           Q 432,328 372,328
           L 300,328
           L 258,398
           L 214,328
           L 140,328
           Q 80,328 80,268
           V 164
           Q 80,104 140,104 Z"/>

  <!-- 气泡上左玻璃高光 -->
  <ellipse cx="150" cy="152" rx="46" ry="24" fill="#ffffff" fill-opacity="0.55"/>

  <!-- ④ 渐变心：居中落在气泡内，粉→珊瑚粉→紫 -->
  <path fill="url(#heart)" stroke="#ff7aa6" stroke-width="5" stroke-linejoin="round"
        d="M 256,284.4
           C 256,284.4 181.6,228.6 181.6,179.0
           C 181.6,179.0 181.6,147.8 231.2,135.6
           C 231.2,135.6 249.8,135.6 256,154.2
           C 256,154.2 262.2,135.6 280.8,135.6
           C 280.8,135.6 305.6,147.8 330.4,179.0
           C 330.4,179.0 330.4,228.6 256,284.4 Z"/>

  <!-- 心形上左高光（玻璃质感，低透明不洗色） -->
  <ellipse cx="222" cy="168" rx="22" ry="12" fill="#ffffff" fill-opacity="0.45"/>
</svg>
