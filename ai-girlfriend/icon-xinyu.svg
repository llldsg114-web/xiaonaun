<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 心屿 APP 图标：AI 女友「小暖」——柔和浅发萌妹漫头风（参考抖音二次元头像画风）。
       无 width/height 属性，交给 cairosvg CLI 的 -W/-H 覆盖。 -->
  <!-- 光栅化目标：cairosvg 2.8.2。只使用 linearGradient / 基础图形 / path / transform / stroke。
       禁止 filter、radialGradient、mask、clip-path、foreignObject（cairosvg 下不安全）。 -->
  <!-- 本轮相对上一版的画风修正：① 去掉全部天使元素（光环 haloG / 翅膀 wingF / 手持四角星 starG 与小手）；
       ② 深 plum 发色 → 浅暖金；③ 高饱和粉紫底 → 极淡粉白蓝；④ 死黑硬描边 → 与肤发同族的柔和暖棕描边；
       ⑤ 夸张大眼 → 大而温柔的眼型（细睫毛线 + 柔和暖褐虹膜）。 -->
  <!-- 背景 rect 铺满 512×512 且 rx=0，保证 opaque=true（避免 iOS 圆角外露黑边）。 -->
  <defs>
    <!-- 背景：极淡的粉 → 近白 → 浅蓝。低饱和，呼应"心的岛屿"但不刺眼。 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset="0.38" stop-color="#fef7f8"/>
      <stop offset="0.72" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#e4effa"/>
    </linearGradient>
    <!-- 后发：浅暖金，比前发略深半档，用于分出前后发层次 -->
    <linearGradient id="hairBack" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f2e2c4"/>
      <stop offset="0.55" stop-color="#e8d0a6"/>
      <stop offset="1" stop-color="#dcbf92"/>
    </linearGradient>
    <!-- 前发/刘海：浅暖金，顶部更亮，营造柔和体积感 -->
    <linearGradient id="hairFront" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fcf3e1"/>
      <stop offset="0.5" stop-color="#f0dcb8"/>
      <stop offset="1" stop-color="#e3c996"/>
    </linearGradient>
    <!-- 发丝高光带：用线性渐变的两端透明模拟弧形柔光（替代 radialGradient） -->
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fffdf6" stop-opacity="0.85"/>
      <stop offset="0.66" stop-color="#fffaee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </linearGradient>
    <!-- 肤色：上亮下暖，柔和体积感 -->
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff4ea"/>
      <stop offset="0.6" stop-color="#ffe6d5"/>
      <stop offset="1" stop-color="#fbd6c0"/>
    </linearGradient>
    <!-- 虹膜：柔和暖褐（榛果色），配浅金发比冷蓝更自然、更温柔 -->
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5344"/>
      <stop offset="0.42" stop-color="#a9754f"/>
      <stop offset="0.78" stop-color="#dcb182"/>
      <stop offset="1" stop-color="#f6e5c8"/>
    </linearGradient>
    <!-- 衣领：白 → 淡蓝，漫头风只留一点点暗示 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7f0fb"/>
    </linearGradient>
    <!-- 爱心发夹：品牌粉 #ff5b8a 主色 + 高光侧（造型小巧，作为品牌符号弱化保留） -->
    <linearGradient id="heartPin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff97b9"/>
      <stop offset="0.45" stop-color="#ff5b8a"/>
      <stop offset="1" stop-color="#ef5081"/>
    </linearGradient>
  </defs>

  <!-- ① 背景：必须铺满且不透明 -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- ② 极淡光晕圆（"岛"意象），只做空气感，不抢主体 -->
  <circle cx="256" cy="270" r="216" fill="#ffffff" opacity="0.38"/>
  <circle cx="256" cy="270" r="216" fill="none" stroke="#ffd9e6" stroke-width="4" opacity="0.34"/>

  <!-- ③ 氛围点缀：两颗柔和小星 + 一颗小爱心，低透明度，保持干净 -->
  <path transform="translate(80,120) scale(0.62)" fill="#ffffff" opacity="0.85"
        d="M 0 -20 C 2.5 -7 7 -2.5 20 0 C 7 2.5 2.5 7 0 20 C -2.5 7 -7 2.5 -20 0 C -7 -2.5 -2.5 -7 0 -20 Z"/>
  <path transform="translate(440,124) scale(0.44)" fill="#ffffff" opacity="0.78"
        d="M 0 -20 C 2.5 -7 7 -2.5 20 0 C 7 2.5 2.5 7 0 20 C -2.5 7 -7 2.5 -20 0 C -7 -2.5 -2.5 -7 0 -20 Z"/>
  <path transform="translate(452,432) scale(0.26)" fill="#ff9ebb" opacity="0.55"
        d="M 0 40 C -6 32 -46 8 -46 -14 C -46 -30 -34 -40 -21 -40 C -11 -40 -4 -34 0 -27 C 4 -34 11 -40 21 -40 C 34 -40 46 -30 46 -14 C 46 8 6 32 0 40 Z"/>
  <path transform="translate(58,412) scale(0.2)" fill="#ffb6cd" opacity="0.45"
        d="M 0 40 C -6 32 -46 8 -46 -14 C -46 -30 -34 -40 -21 -40 C -11 -40 -4 -34 0 -27 C 4 -34 11 -40 21 -40 C 34 -40 46 -30 46 -14 C 46 8 6 32 0 40 Z"/>

  <!-- ④ 后发（圆润中长发轮廓，人物最底层）。浅发＋浅底靠柔和暖棕描边保证小尺寸剪影可读，
       描边色 #d6ab7b 与发色同族，不用死黑。 -->
  <path fill="url(#hairBack)" stroke="#d6ab7b" stroke-width="3.2" stroke-linejoin="round"
        d="M 256 68 C 150 68 92 150 98 256
           C 102 324 90 394 80 452
           C 128 474 184 466 208 448 L 304 448
           C 328 466 384 474 432 452
           C 422 394 410 324 414 256
           C 420 150 362 68 256 68 Z"/>

  <!-- ⑤ 细脖颈（漫头风只露一小截） -->
  <path fill="#f7cfb7" d="M 226 394 h 60 v 52 a 30 30 0 0 1 -60 0 Z"/>

  <!-- ⑥ 衣领暗示：底边一小片白→淡蓝领口，不画完整半身 -->
  <path fill="url(#cloth)" stroke="#dfe9f6" stroke-width="2.5" stroke-linejoin="round"
        d="M 166 512 C 176 484 200 468 226 462 C 240 474 272 474 286 462
           C 312 468 336 484 346 512 Z"/>
  <path fill="none" stroke="#ffa7c1" stroke-width="7" stroke-linecap="round" opacity="0.9"
        d="M 226 462 C 240 476 272 476 286 462"/>

  <!-- ⑦ 脸：圆润柔和、下巴自然收窄；描边用浅暖棕 #e8a98c（非死黑） -->
  <path fill="url(#skin)" stroke="#e8a98c" stroke-width="2.8"
        d="M 128 266 C 128 174 170 126 256 126 C 342 126 384 174 384 266
           C 384 344 348 404 298 430 C 280 439 232 439 214 430
           C 164 404 128 344 128 266 Z"/>

  <!-- ⑧ 腮红：三层同心椭圆叠加模拟柔和晕染（不使用 radialGradient/filter） -->
  <g fill="#ff9fb8">
    <ellipse cx="180" cy="376" rx="26" ry="14" opacity="0.16"/>
    <ellipse cx="180" cy="376" rx="19" ry="10.5" opacity="0.17"/>
    <ellipse cx="180" cy="376" rx="12.5" ry="7" opacity="0.18"/>
    <ellipse cx="332" cy="376" rx="26" ry="14" opacity="0.16"/>
    <ellipse cx="332" cy="376" rx="19" ry="10.5" opacity="0.17"/>
    <ellipse cx="332" cy="376" rx="12.5" ry="7" opacity="0.18"/>
  </g>

  <!-- ⑨ 眼睛：大但温柔。眼白 → 暖褐柔和虹膜 → 瞳仁 → 下缘反光 → 双柔高光 → 细而上扬的睫毛线。
       睫毛用 #7a5a6a 柔和色、线宽收窄，避免上一版 #3b2440 粗黑线造成的凶相。 -->
  <g>
    <!-- 左眼 -->
    <ellipse cx="196" cy="322" rx="39" ry="42" fill="#fffdfa"/>
    <ellipse cx="196" cy="326" rx="32" ry="36" fill="url(#iris)"/>
    <ellipse cx="196" cy="330" rx="14.5" ry="19" fill="#513a2e"/>
    <ellipse cx="196" cy="348" rx="16" ry="7" fill="#fff1d8" opacity="0.72"/>
    <circle cx="182" cy="306" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="211" cy="344" r="6.5" fill="#ffffff" opacity="0.8"/>
    <path fill="none" stroke="#7a5a6a" stroke-width="11" stroke-linecap="round"
          d="M 158 320 C 160 272 234 272 235 320"/>
    <path fill="none" stroke="#7a5a6a" stroke-width="7.5" stroke-linecap="round" d="M 160 302 L 147 291"/>
    <path fill="none" stroke="#d79aae" stroke-width="4" stroke-linecap="round" opacity="0.5"
          d="M 166 354 C 180 366 212 366 226 354"/>
    <!-- 右眼 -->
    <ellipse cx="316" cy="322" rx="39" ry="42" fill="#fffdfa"/>
    <ellipse cx="316" cy="326" rx="32" ry="36" fill="url(#iris)"/>
    <ellipse cx="316" cy="330" rx="14.5" ry="19" fill="#513a2e"/>
    <ellipse cx="316" cy="348" rx="16" ry="7" fill="#fff1d8" opacity="0.72"/>
    <circle cx="302" cy="306" r="12" fill="#ffffff" opacity="0.95"/>
    <circle cx="331" cy="344" r="6.5" fill="#ffffff" opacity="0.8"/>
    <path fill="none" stroke="#7a5a6a" stroke-width="11" stroke-linecap="round"
          d="M 277 320 C 278 272 352 272 354 320"/>
    <path fill="none" stroke="#7a5a6a" stroke-width="7.5" stroke-linecap="round" d="M 352 302 L 365 291"/>
    <path fill="none" stroke="#d79aae" stroke-width="4" stroke-linecap="round" opacity="0.5"
          d="M 286 354 C 300 366 332 366 346 354"/>
  </g>

  <!-- ⑩ 小鼻 + 恬静小嘴（淡粉 #d98aa0 系） -->
  <path fill="none" stroke="#eab49b" stroke-width="4" stroke-linecap="round"
        d="M 250 378 C 253 385 260 385 262 380"/>
  <path fill="#d98aa0" d="M 243 400 C 249 413 263 413 269 400 C 261 407 251 407 243 400 Z"/>

  <!-- ⑪ 刘海：自然中分、微偏右，中间留白保证眉眼区通透 -->
  <path fill="url(#hairFront)" stroke="#d6ab7b" stroke-width="3" stroke-linejoin="round"
        d="M 120 254 C 112 152 170 92 256 92 C 342 92 400 152 392 254
           C 384 214 366 186 344 170 C 344 200 332 224 312 238
           C 320 192 306 154 274 132 C 266 162 262 184 260 202
           C 258 184 254 166 248 136 C 216 158 194 192 202 238
           C 180 224 168 200 168 170 C 146 186 128 214 120 254 Z"/>
  <!-- 发丝柔光（两道，一主一辅） -->
  <path fill="url(#hairShine)"
        d="M 154 170 C 186 128 228 108 284 110 C 256 126 232 148 218 178
           C 192 171 172 168 154 170 Z"/>
  <path fill="url(#hairShine)" opacity="0.6"
        d="M 300 120 C 330 132 352 152 364 178 C 348 168 330 162 312 160
           C 310 144 306 131 300 120 Z"/>

  <!-- ⑫ 眉毛：细眉、微弧，颜色取比发色深一档的暖棕，温柔不凶 -->
  <path fill="none" stroke="#c79a70" stroke-width="4.5" stroke-linecap="round"
        d="M 164 256 C 182 245 214 245 231 255"/>
  <path fill="none" stroke="#c79a70" stroke-width="4.5" stroke-linecap="round"
        d="M 348 256 C 330 245 298 245 281 255"/>
  <!-- 眉下极淡眼影线，进一步柔化眉眼关系 -->
  <path fill="none" stroke="#eda9bd" stroke-width="3" stroke-linecap="round" opacity="0.42"
        d="M 164 272 C 182 266 208 266 223 272"/>
  <path fill="none" stroke="#eda9bd" stroke-width="3" stroke-linecap="round" opacity="0.42"
        d="M 348 272 C 330 266 304 266 289 272"/>

  <!-- ⑬ 两侧前发：框脸但圆润，末端自然收窄 -->
  <path fill="url(#hairFront)" stroke="#d6ab7b" stroke-width="3" stroke-linejoin="round"
        d="M 134 232 C 118 306 124 386 140 450 C 164 444 184 430 192 412
           C 174 354 170 286 176 236 Z"/>
  <path fill="url(#hairFront)" stroke="#d6ab7b" stroke-width="3" stroke-linejoin="round"
        d="M 378 232 C 394 306 388 386 372 450 C 348 444 328 430 320 412
           C 338 354 342 286 336 236 Z"/>

  <!-- ⑭ 呆毛：一小撮柔和翘发，增加软萌感 -->
  <path fill="url(#hairFront)" stroke="#d6ab7b" stroke-width="2.6" stroke-linejoin="round"
        d="M 248 96 C 240 74 250 56 270 48 C 260 62 260 74 268 84
           C 262 86 254 90 248 96 Z"/>

  <!-- ⑮ 爱心发夹（品牌符号 #ff5b8a，别在右侧刘海，scale 0.5 小巧精致、白描边细） -->
  <g transform="translate(344,160) rotate(12)">
    <path transform="scale(0.5)" fill="url(#heartPin)" stroke="#ffffff" stroke-width="6"
          d="M 0 40 C -6 32 -46 8 -46 -14 C -46 -30 -34 -40 -21 -40 C -11 -40 -4 -34 0 -27 C 4 -34 11 -40 21 -40 C 34 -40 46 -30 46 -14 C 46 8 6 32 0 40 Z"/>
    <ellipse cx="-9" cy="-8" rx="5.5" ry="3.6" fill="#ffffff" opacity="0.7" transform="rotate(-32)"/>
  </g>
</svg>
