<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 心屿 APP 图标 · v6 几何「心屿」品牌标记（全量重写，删除 v1–v5 所有「小暖」人物头像）。
       用户反复否决 v1–v5（均为小暖人物肖像：银发 / 兔耳 / 黑蝴蝶结等），明确只要「手机桌面级应用图标」——
       符号化品牌标，非人物肖像。本轮改为几何「心屿」：不透明品牌渐变底 + 居中白色心形（含上左高光）
       + 心形下半部蓝紫「屿」小岛场景（水波 / 紫丘 / 暖色星）。无人物、无文字、无名字。
       cairosvg 2.8.2 约束：仅 linearGradient，禁 filter/radialGradient/mask/clip-path/foreignObject。
       根 <svg> 不写 width/height，交给 CLI -W/-H。背景 rect 铺满 512×512 且 rx=0 → 不透明（防 iOS 圆角黑边）。 -->
  <defs>
    <!-- 品牌渐变底：粉(#ffd9e8) → 薰衣草(#e7dcf6) → 天蓝(#cfe6ff) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9e8"/>
      <stop offset="0.5" stop-color="#e7dcf6"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <!-- 心形：白 → 极淡薰衣草，柔体积 -->
    <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4eefb"/>
    </linearGradient>
    <!-- 心形高光：白(不透明) → 透明，上左 lobe 的玻璃质感 -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 水波：浅蓝 → 蓝 -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#9cc6f7"/>
    </linearGradient>
    <!-- 屿（小岛丘）：柔紫 -->
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b6ea"/>
      <stop offset="1" stop-color="#a98fd6"/>
    </linearGradient>
  </defs>

  <!-- ① 背景：铺满且不透明 -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- ② 两枚极淡白光晕圆，只做空气感，保持干净 -->
  <circle cx="256" cy="262" r="230" fill="#ffffff" opacity="0.06"/>
  <circle cx="120" cy="108" r="64" fill="#ffffff" opacity="0.08"/>

  <!-- ③ 白色心形（心） -->
  <path fill="url(#heartFill)" stroke="#eadff6" stroke-width="2"
        d="M 256 396
           C 150 316 96 256 96 201
           C 96 154 132 126 170 126
           C 210 126 244 156 256 191
           C 268 156 302 126 342 126
           C 380 126 416 154 416 201
           C 416 256 362 316 256 396 Z"/>

  <!-- ④ 心形下半部：水波（蓝） -->
  <path fill="url(#water)" stroke="#8fbdf2" stroke-width="1.5"
        d="M 150 292
           C 172 300 196 286 220 292
           C 242 298 270 288 296 292
           C 322 296 344 286 362 292
           C 356 318 332 338 302 346
           C 282 352 230 352 210 346
           C 180 338 156 318 150 292 Z"/>

  <!-- ⑤ 屿：紫丘，从水中升起，居中 -->
  <path fill="url(#island)" stroke="#9a7fcf" stroke-width="1.5"
        d="M 214 326
           C 222 308 240 300 256 300
           C 272 300 290 308 298 326
           C 280 332 232 332 214 326 Z"/>

  <!-- ⑥ 暖色小星 sparkle，屿上方 -->
  <path fill="#fff7c2" stroke="#ffe98f" stroke-width="0.8"
        d="M 296 274
           C 298 280 302 284 308 286
           C 302 288 298 292 296 298
           C 294 292 290 288 284 286
           C 290 284 294 280 296 274 Z"/>

  <!-- ⑦ 心形高光：上左 lobe 玻璃质感 -->
  <ellipse cx="190" cy="188" rx="42" ry="52" transform="rotate(-18 190 188)" fill="url(#shine)"/>
  <ellipse cx="330" cy="192" rx="24" ry="34" transform="rotate(18 330 192)" fill="url(#shine)" opacity="0.5"/>
</svg>
